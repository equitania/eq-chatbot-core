name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Create venv
        run: uv venv --python 3.12

      - name: Install dev dependencies
        run: uv pip install -e ".[dev,security,pdf,image,azure,vertex,server]"

      - name: Run ruff lint
        run: uv run ruff check src/ tests/

      - name: Run ruff format check
        run: uv run ruff format --check src/ tests/

      # mypy strict is clean and gated hard. It was ratcheted against a baseline
      # of 157 pre-existing errors until v2.1.0 paid that debt down to zero; a
      # ratchet is only worth having while there is debt to hold down.
      - name: Run mypy (strict)
        run: uv run mypy src/

  security:
    name: Dependency vulnerability audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Create venv
        run: uv venv --python 3.12

      - name: Install package and dev extras
        run: uv pip install -e ".[dev,security,pdf,image,azure,vertex,server]"

      # Scans installed dependencies against the PyPI Advisory DB. This is a HARD
      # gate: a disclosed CVE in a (transitive) dependency must be triaged, not
      # merged past. If a finding is genuinely not applicable and no fixed release
      # exists yet, unblock deliberately with an explicit, commented exception:
      #   uv run pip-audit --strict --ignore-vuln GHSA-xxxx-xxxx-xxxx
      - name: Run pip-audit
        run: uv run pip-audit --strict

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Create venv
        run: uv venv --python ${{ matrix.python-version }}

      - name: Install package and dev extras
        run: uv pip install -e ".[dev,security,pdf,image,azure,vertex,server]"

      - name: Run unit tests with coverage
        env:
          SKIP_LIVE_TESTS: "true"
          SKIP_LOCAL_TESTS: "true"
        run: uv run pytest tests/unit/ -v --cov=eq_chatbot_core --cov-report=term-missing --cov-report=xml

      - name: Upload coverage artifact
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: ignore

# Note: build & publish run locally on the maintainer's machine via /afterwork.
# CI scope is intentionally limited to lint + test on the matrix — building and
# publishing happen outside CI to keep credentials local and let the maintainer
# inspect builds before pushing to PyPI.
