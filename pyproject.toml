[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "eq-chatbot-core"
dynamic = ["version"]
description = "Core library for LLM chatbot integration with multi-provider support (OpenAI, Anthropic, LangDock, OpenRouter, Mammouth, Azure, Vertex AI, LiteLLM, IONOS, Local)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Equitania Software GmbH", email = "info@equitania.de" },
]
keywords = [
    "chatbot", "llm", "openai", "anthropic", "langdock", "openrouter", "mammouth", "azure",
    "vertex", "gemini", "litellm", "ionos", "ollama", "rag", "mcp", "odoo", "ai", "nlp",
    "embedding", "encryption"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "openai>=2.0.0,<3.0.0",
    "anthropic>=0.90.0,<2.0.0",
    "qdrant-client>=1.12.0,<2.0.0",
    "tiktoken>=0.9.0,<1.0.0",
    # Floor 46.0.7 excludes CVE-2026-26007 / CVE-2026-39892 / CVE-2026-34073
    # (wildcard SAN name-constraint bypass); still supports Python 3.10.
    "cryptography>=46.0.7,<50.0.0",
    "httpx>=0.27.0,<1.0.0",
    "pydantic>=2.11.0,<3.0.0",
    # Floor 8.3.3 excludes CVE-2026-7246 (command injection in click.edit()).
    "click>=8.3.3,<9.0.0",
    "tomli>=2.0.0; python_version < '3.11'",  # CLI config file parsing (tomllib is stdlib from 3.11)
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0,<10.0.0",
    "pytest-cov>=6.0.0,<8.0.0",
    "pytest-asyncio>=0.24.0,<2.0.0",
    # Floor 1.2.2 excludes PYSEC-2026-2270.
    "python-dotenv>=1.2.2,<2.0.0",  # For loading .env.test in tests
    "ruff>=0.12.0,<1.0.0",
    "mypy>=1.15.0,<2.0.0",
    "twine>=6.0.0,<7.0.0",
    "pre-commit>=4.0.0,<5.0.0",
    "pip-audit>=2.7.0,<3.0.0",  # Dependency vulnerability scanning (CI security gate)
]
local = [
    "sentence-transformers>=3.0.0,<6.0.0",  # For local embeddings
]
security = [
    # Pure Python MIME type verification (no libmagic dependency).
    # puremagic 2.x requires Python >=3.12; allow 1.10+ for users on 3.10/3.11.
    # Both 1.x and 2.x expose the from_string(..., mime=True) and PureError API used by file_validator.
    "puremagic>=1.10,<3.0",
]
pdf = [
    # NOTE: pymupdf is AGPL-3.0-or-later (commercial license available from
    # Artifex). This project is MIT; the dependency is kept OPTIONAL so the core
    # library stays permissively licensed. Installing this extra subjects the
    # resulting distribution to AGPL obligations unless a commercial PyMuPDF
    # license is held. The same applies to the [docs] extra below.
    "pymupdf>=1.26.0,<2.0.0",  # For PDF to image conversion (OpenAI/LangDock vision support)
]
docs = [
    # Document-to-Markdown extraction for knowledge ingestion (services/document_extractor.py)
    "markitdown[docx,pdf,pptx,xlsx]>=0.1.1,<0.2.0",
    "pymupdf>=1.26.0,<2.0.0",  # Embedded-image extraction from PDFs
]
azure = [
    # Intentionally empty since v2.0.0. The Azure provider now drives the Azure
    # OpenAI /v1 endpoint through the `openai` SDK (already a core dependency),
    # because Microsoft retires the azure-ai-inference beta SDK on 2026-08-26.
    # The extra is kept as a no-op so existing `pip install ...[azure]` commands
    # and deployment scripts keep working instead of erroring on an unknown extra.
]
vertex = [
    # 2.x verified against the API surface this provider uses: genai.Client(
    # vertexai=/project=/location=), models.generate_content(_stream)(model=,
    # contents=, config=), types.Content/Part.from_text/from_function_response/
    # FunctionDeclaration/Tool/GenerateContentConfig.
    "google-genai>=2.0.0,<3.0.0",
]
image = [
    # Floor 12.3.0 excludes CVE-2026-59205 (ImageCmsTransform buffer overflow),
    # which affects every earlier Pillow release.
    "Pillow>=12.3.0,<13.0",
]
realtime = [
    "websockets>=13.0,<17.0",
]
server = [
    # Localhost HTTP gateway for cross-language integrations (e.g. fr-designer
    # Avalonia desktop app spawning eq-chatbot as a sidecar).
    "fastapi>=0.115.0,<1.0.0",
    "uvicorn>=0.32.0,<1.0.0",
    # 3.x verified: the only API used is EventSourceResponse(<async generator of
    # {"event": ..., "data": ...} dicts>), exercised end-to-end by the server
    # streaming tests.
    "sse-starlette>=3.0.0,<4.0.0",
]

[project.scripts]
eq-chatbot = "eq_chatbot_core.cli:main"

[project.urls]
Homepage = "https://www.ownerp.com"
Documentation = "https://github.com/equitania/eq-chatbot-core"
Repository = "https://github.com/equitania/eq-chatbot-core.git"
Changelog = "https://github.com/equitania/eq-chatbot-core/blob/main/CHANGELOG.md"

[tool.hatch.version]
path = "src/eq_chatbot_core/version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/eq_chatbot_core"]
# Ship the bundled pricing snapshot (offline fallback for PricingCatalog) and the
# CLI config template (used by `eq-chatbot config init`).
artifacts = ["src/eq_chatbot_core/data/*.json", "src/eq_chatbot_core/data/*.example"]

[tool.hatch.build.targets.wheel.force-include]
"src/eq_chatbot_core/data/model_prices.json" = "eq_chatbot_core/data/model_prices.json"
"src/eq_chatbot_core/data/capability_catalog.json" = "eq_chatbot_core/data/capability_catalog.json"
"src/eq_chatbot_core/data/capability_overrides.json" = "eq_chatbot_core/data/capability_overrides.json"
"src/eq_chatbot_core/data/config.toml.example" = "eq_chatbot_core/data/config.toml.example"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # Pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by ruff format)
    "B008",  # do not perform function calls in argument defaults
]

[tool.ruff.lint.per-file-ignores]
# Tests use legitimate patterns that ruff doesn't understand:
#   E402 — imports after sys.modules[...] mocking (intentional)
#   B017 — pytest.raises(Exception) for broad exception assertions
"tests/**/*.py" = ["E402", "B017"]

[tool.ruff.lint.isort]
known-first-party = ["eq_chatbot_core"]

[tool.ruff.format]
line-ending = "auto"

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
asyncio_mode = "auto"
markers = [
    "unit: Unit tests (mocked, fast, no external dependencies)",
    "integration: Integration tests (real API calls, requires API keys)",
    "local: Local LLM server tests (requires running LM Studio or Ollama)",
    "expensive: Tests with expensive models (skip in CI by default)",
    "slow: Slow-running tests",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.coverage.run]
source = ["src/eq_chatbot_core"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]
