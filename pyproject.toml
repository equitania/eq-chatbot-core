[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "eq-chatbot-core"
dynamic = ["version"]
description = "Core library for LLM chatbot integration with multi-provider support (OpenAI, Anthropic, LangDock, OpenRouter, Mammouth, Azure, Vertex AI, Local)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Equitania Software GmbH", email = "info@equitania.de" },
]
keywords = [
    "chatbot", "llm", "openai", "anthropic", "langdock", "openrouter", "mammouth", "azure",
    "vertex", "gemini", "ollama", "rag", "mcp", "odoo", "ai", "nlp", "embedding", "encryption"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "openai>=2.0.0,<3.0.0",
    "anthropic>=0.90.0,<2.0.0",
    "qdrant-client>=1.12.0,<2.0.0",
    "tiktoken>=0.9.0,<1.0.0",
    "cryptography>=44.0.0,<49.0.0",
    "httpx>=0.27.0,<1.0.0",
    "pydantic>=2.11.0,<3.0.0",
    "click>=8.1.0,<9.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0,<10.0.0",
    "pytest-cov>=6.0.0,<8.0.0",
    "pytest-asyncio>=0.24.0,<2.0.0",
    "python-dotenv>=1.0.0,<2.0.0",  # For loading .env.test in tests
    "ruff>=0.12.0,<1.0.0",
    "mypy>=1.15.0,<2.0.0",
    "twine>=6.0.0,<7.0.0",
    "pre-commit>=4.0.0,<5.0.0",
    "pip-audit>=2.7.0,<3.0.0",  # Dependency vulnerability scanning (CI security gate)
]
local = [
    "sentence-transformers>=3.0.0,<6.0.0",  # For local embeddings
]
security = [
    # Pure Python MIME type verification (no libmagic dependency).
    # puremagic 2.x requires Python >=3.12; allow 1.10+ for users on 3.10/3.11.
    # Both 1.x and 2.x expose the from_string(..., mime=True) and PureError API used by file_validator.
    "puremagic>=1.10,<3.0",
]
pdf = [
    "pymupdf>=1.26.0,<2.0.0",  # For PDF to image conversion (OpenAI/LangDock vision support)
]
azure = [
    "azure-ai-inference>=1.0.0b9",
    "azure-core>=1.30.0",
]
vertex = [
    "google-genai>=1.0.0",
]
realtime = [
    "websockets>=13.0,<17.0",
]
server = [
    # Localhost HTTP gateway for cross-language integrations (e.g. fr-designer
    # Avalonia desktop app spawning eq-chatbot as a sidecar).
    "fastapi>=0.115.0,<1.0.0",
    "uvicorn>=0.32.0,<1.0.0",
    "sse-starlette>=2.1.0,<3.0.0",
]

[project.scripts]
eq-chatbot = "eq_chatbot_core.cli:main"

[project.urls]
Homepage = "https://www.ownerp.com"
Documentation = "https://github.com/equitania/eq-chatbot-core"
Repository = "https://github.com/equitania/eq-chatbot-core.git"
Changelog = "https://github.com/equitania/eq-chatbot-core/blob/main/CHANGELOG.md"

[tool.hatch.version]
path = "src/eq_chatbot_core/version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/eq_chatbot_core"]
# Ship the bundled pricing snapshot (offline fallback for PricingCatalog).
artifacts = ["src/eq_chatbot_core/data/*.json"]

[tool.hatch.build.targets.wheel.force-include]
"src/eq_chatbot_core/data/model_prices.json" = "eq_chatbot_core/data/model_prices.json"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # Pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by ruff format)
    "B008",  # do not perform function calls in argument defaults
]

[tool.ruff.lint.per-file-ignores]
# Tests use legitimate patterns that ruff doesn't understand:
#   E402 — imports after sys.modules[...] mocking (intentional)
#   B017 — pytest.raises(Exception) for broad exception assertions
"tests/**/*.py" = ["E402", "B017"]

[tool.ruff.lint.isort]
known-first-party = ["eq_chatbot_core"]

[tool.ruff.format]
line-ending = "auto"

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
asyncio_mode = "auto"
markers = [
    "unit: Unit tests (mocked, fast, no external dependencies)",
    "integration: Integration tests (real API calls, requires API keys)",
    "local: Local LLM server tests (requires running LM Studio or Ollama)",
    "expensive: Tests with expensive models (skip in CI by default)",
    "slow: Slow-running tests",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.coverage.run]
source = ["src/eq_chatbot_core"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]
